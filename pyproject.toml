[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent LangGraph freelancer copilot (AI-4016 R&D assignment)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# Version policy: every direct dependency is bounded to a tested major/minor
# range. `uv lock` writes uv.lock, which pins EXACT versions; commit uv.lock.
# Re-check the lower bounds against PyPI on the day you lock.
dependencies = [
    # --- agent orchestration ---
    "langgraph>=0.6,<2.0",
    "langgraph-checkpoint-postgres>=2.0,<4.0",   # Postgres checkpointer (assignment C6)
    "langchain-core>=0.3,<2.0",
    "langchain-mcp-adapters>=0.1,<1.0",
    "mcp>=1.12,<2.0",                            # official MCP Python SDK

    # --- API layer ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sse-starlette>=2.1,<4.0",                   # SSE bridge for LangGraph streams
    "httpx>=0.27,<1.0",

    # --- persistence / queue ---
    "redis>=5.0,<7.0",
    "asyncpg>=0.29,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",            # required by langgraph-checkpoint-postgres
    "celery[redis]>=5.4,<6.0",

    # --- config ---
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "playwright>=1.47,<2.0",
    "pytest-playwright>=0.5,<1.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "apps", "rag", "mcp_servers", "worker", "evals"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
addopts = "-ra --strict-markers"
markers = [
    "integration: runs graphs against GigSim (needs docker compose up)",
    "contract: MCP tool-schema snapshot tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["gigsim", "data"]   # gigsim/ is provided and must not be modified

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
