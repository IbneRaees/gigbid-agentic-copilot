project: "GigBid"
course: "AI-4016"

marketplace:
  # Switched via MARKETPLACE_MODE env var: "gigsim" | "upwork_live"
  mode: "${MARKETPLACE_MODE:-gigsim}"
  gigsim_base_url: "http://127.0.0.1:8010"

llm:
  provider: "openrouter"
  model: "openai/gpt-4o-mini"
  temperature: 0.2
  max_tokens: 1200
  timeout_s: 30

rag:
  default_variant: "v4"
  top_k_portfolio: 4
  top_k_policy: 3
  embedding_model: "BAAI/bge-small-en-v1.5"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  index_dir: "rag/index/local_store"

safety:
  require_human_approval: true
  min_grounding_score: 0.85
  max_daily_budget_usd: 5.0
