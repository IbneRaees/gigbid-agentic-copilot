==============================================================================GigBid Runtime & Orchestration ConfigurationAll model routing, RAG design choices, budgets, guardrails, and marketplacepolicy parameters live here (never hardcoded in Python modules).==============================================================================app:
name: "GigBid"
version: "0.2.0"
course: "AI-4016"marketplace:Switched via MARKETPLACE_MODE env var: "gigsim" | "upwork_live"mode: "${MARKETPLACE_MODE:gigsim}"
gigsim:
base_url: "${GIGSIM_BASE_URL:http://localhost:8081}"
api_token: "${GIGSIM_API_TOKEN:gigsim-dev-token-2026}"
timeout_seconds: 10.0
max_retries: 3
backoff_base_seconds: 0.75
rate_limit_rpm: 60
upwork_live:
mcp_url: "${UPWORK_MCP_URL:https://mcp.upwork.com/mcp}"
# Conservative schedule to respect Upwork API terms and avoid scraping behavior
poll_interval_minutes: 30
max_jobs_per_poll: 25
draft_only_writes: true==============================================================================Model Profiles: "open" (default, zero-API-cost capable) vs "paid" (optional)==============================================================================models:
active_profile: "${MODEL_PROFILE:open}"Shared across BOTH profiles (runs locally on CPU/GPU)embeddings:
model_name: "${EMBEDDING_MODEL:BAAI/bge-m3}"
dimension: 1024
device: "${EMBEDDING_DEVICE:cpu}"
normalize_embeddings: true
batch_size: 32reranker:
model_name: "${RERANKER_MODEL:BAAI/bge-reranker-v2-m3}"
device: "${RERANKER_DEVICE:cpu}"
top_n: 8profiles:
open:
description: "Open-weight models only (local Ollama/vLLM or hosted open providers)"
default_provider: "ollama"
ollama_base_url: "${OLLAMA_BASE_URL:http://localhost:11434}"
openrouter_base_url: "https://openrouter.ai/api/v1"
groq_base_url: "https://api.groq.com/openai/v1"
