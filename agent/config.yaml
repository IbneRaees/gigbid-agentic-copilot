==============================================================================Retrieval-Augmented Generation (RAG) Configuration==============================================================================rag:Selectable variant: v0_naive | v1_decomp | v2_hybrid | v3_reranked |v4_outcome | v5_multivector | v6_contextual | v7_hyde | v8_corrective | v9_skill_graphactive_variant: "v3_reranked"
chunk_size_tokens: 420
chunk_overlap_tokens: 64
top_k_dense: 15
top_k_bm25: 15
top_k_final: 6
rrf_k: 60
outcome_boost_weights:
won: 1.35
interview: 1.20
replied: 1.10
viewed: 1.02
ignored: 0.90
claim_verification:
enabled: true
min_support_score: 0.72
strip_unsupported_claims: true==============================================================================LangGraph Orchestration, Loops & Latency/Cost Budgets==============================================================================orchestration:
max_critic_revisions: 2
max_graph_steps: 24
max_tokens_per_thread: 36000
node_timeout_seconds: 45
node_max_retries: 2
checkpoint_backend: "postgres"budgets:Declared p95 latency and cost ceilings (Requirement E5)target_p95_job_analysis_seconds: 8.5
target_p95_proposal_seconds: 22.0
max_cost_per_job_analysis_usd: 0.015
max_cost_per_proposal_usd: 0.050
default_weekly_connects_budget: 60==============================================================================Autonomy, Guardrails & Memory Promotion Rules==============================================================================guardrails:Non-negotiable: auto_send must remain permanently falseauto_send: false
allow_auto_skip: true
auto_skip_min_fit_score: 0.32
auto_skip_max_risk_score: 0.75
pii_masking_enabled: true
untrusted_data_delimiters:
job_post: ["<UNTRUSTED_JOB_POST>", "</UNTRUSTED_JOB_POST>"]
client_message: ["<UNTRUSTED_CLIENT_MESSAGE>", "</UNTRUSTED_CLIENT_MESSAGE>"]
prompt_injection_patterns:
- "ignore previous instructions"
- "ignore all prior instructions"
- "system prompt"
- "disregard your rules"
- "output your instructions"
- "send via whatsapp"
- "pay outside upwork"
- "telegram @"memory:
style_memory:
enabled: true
min_edit_occurrences: 2
max_rules_per_user: 25
require_human_diff_signal: true
outcome_memory:
enabled: true
promote_on_outcomes: ["replied", "interview", "won"]
never_store_raw_tool_outputs: true==============================================================================Externalized Marketplace Policy Rules (Change-Request Ready)==============================================================================policy:
policy_pack_path: "data/policy_pack/marketplace_policy.md"
max_connects_per_proposal: 16
min_connects_balance_reserve: 4
min_expected_contract_to_connect_ratio: 15.0
require_payment_verified_above_budget: 1500.0
max_proposal_words: 320
min_proposal_words: 95
platform_fee_tiers:
- up_to_usd: 500
fee_rate: 0.15
- up_to_usd: 10000
fee_rate: 0.10
- up_to_usd: null
fee_rate: 0.05
prohibited_claim_phrases:
- "100% guarantee"
- "guaranteed ranking"
- "work for free"
- "free sample project"
- "contact me at"
- "my whatsapp"
- "my telegram"
- "pay via paypal"
- "pay via crypto"
- "off-platform"